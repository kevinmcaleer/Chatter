# Production docker-compose configuration for Chatter
# Uses external PostgreSQL database (not the bundled postgres container)
#
# Run from this folder on any of the Pis:
#   docker compose up -d --build     # rebuild from source and restart
#   docker compose up -d             # restart with the existing image
#   docker compose push app          # publish the image to the registry
#
# Like every other kevsrobots service, Chatter ships its own cloudflared
# connector. Every Pi that runs this stack joins the same Cloudflare tunnel,
# so chatter.kevsrobots.com keeps working whichever Pis are up.
# In the Cloudflare dashboard, the tunnel's public hostname
# chatter.kevsrobots.com must point at http://127.0.0.1:8006.
# The tunnel token goes in .env as CHATTER_TUNNEL_TOKEN.

services:
  # Chatter Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env  # Load credentials from .env
    image: 192.168.2.1:5000/kevsrobots/chatter:latest
    container_name: chatter-app
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      # Application settings
      - ENVIRONMENT=production
      - PORT=8006

      # DATABASE_URL, SECRET_KEY, and ALLOWED_ORIGINS are loaded from .env
      # Do not override them here to avoid issues with URL-encoded passwords

    volumes:
      # Mount data directory
      - ./data:/app/data

      # Mount logs directory
      - ./logs:/app/logs

    # No depends_on since we're using external database
    networks:
      - chatter-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Cloudflare Tunnel connector for chatter.kevsrobots.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    # ``--edge-ip-version 4`` forces the QUIC socket to IPv4 only.
    # Without it, cloudflared binds a dual-stack [::] socket; after a Pi
    # power-cut IPv6 can come up without a working default route, and
    # every send fails with "sendmsg: network is unreachable" indefinitely.
    command: tunnel --no-autoupdate --edge-ip-version 4 run
    environment:
      - TUNNEL_TOKEN=${CHATTER_TUNNEL_TOKEN:?Set CHATTER_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    depends_on:
      - app

networks:
  chatter-network:
    driver: bridge
