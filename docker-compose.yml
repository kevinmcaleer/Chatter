# Production docker-compose configuration for Chatter
# Uses external PostgreSQL database (not the bundled postgres container)
# Run from this folder:
#   docker compose up -d --build     # rebuild from source and restart
#   docker compose up -d             # restart with the existing image
#
# Like the other kevsrobots services, Chatter brings its own Cloudflare
# Tunnel connector, so chatter.kevsrobots.com works from whichever Pi runs
# this stack (run it on several and Cloudflare spreads the traffic). Set
# CHATTER_TUNNEL_TOKEN in .env to the token of the tunnel whose public
# hostname chatter.kevsrobots.com points at http://127.0.0.1:8006.

services:
  # Chatter Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env  # Load credentials from .env
    image: 192.168.2.1:5000/kevsrobots/chatter:latest
    container_name: chatter-app
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      # Application settings
      - ENVIRONMENT=production
      - PORT=8006

      # DATABASE_URL, SECRET_KEY, and ALLOWED_ORIGINS are loaded from .env
      # Do not override them here to avoid issues with URL-encoded passwords

    volumes:
      # Mount data directory
      - ./data:/app/data

      # Mount logs directory
      - ./logs:/app/logs

    # No depends_on since we're using external database
    networks:
      - chatter-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    # ``--edge-ip-version 4`` keeps the QUIC socket IPv4-only, so the tunnel
    # survives a Pi coming back from a power cut with no working IPv6 route
    # (same setting as the other kevsrobots stacks).
    command: tunnel --no-autoupdate --edge-ip-version 4 run
    environment:
      - TUNNEL_TOKEN=${CHATTER_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

networks:
  chatter-network:
    driver: bridge
