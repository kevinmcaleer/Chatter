# Build docker-compose configuration for Chatter (not the production stack)
# Uses external PostgreSQL database (not the bundled postgres container)
# Run from this folder:
#   docker compose build && docker compose push   # build + publish the image
#   docker compose up -d                          # local run of the app only
#
# This file runs the app on its own, without a Cloudflare Tunnel connector.
# Production runs from ClusteredPi: stacks/chatter/docker-compose.prod.yml
# (app + cloudflared, image 192.168.2.1:5000/kevsrobots/chatter:latest).
# Build and push the image here, then pull and `up -d` that stack on each Pi.
# Both folders are called "chatter", so Compose treats them as one project:
# never use --remove-orphans in either.

services:
  # Chatter Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env  # Load credentials from .env
    image: 192.168.2.1:5000/kevsrobots/chatter:latest
    container_name: chatter-app
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      # Application settings
      - ENVIRONMENT=production
      - PORT=8006

      # DATABASE_URL, SECRET_KEY, and ALLOWED_ORIGINS are loaded from .env
      # Do not override them here to avoid issues with URL-encoded passwords

    volumes:
      # Mount data directory
      - ./data:/app/data

      # Mount logs directory
      - ./logs:/app/logs

    # No depends_on since we're using external database
    networks:
      - chatter-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  chatter-network:
    driver: bridge
